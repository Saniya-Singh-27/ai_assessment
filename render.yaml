services:
  # Backend Web Service
  - type: web
    name: ai_assessment
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  # Frontend Static Site
  - type: static
    name: ai-assessment-frontend
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai_assessment
          property: host

databases:
  - name: chatbot-db
    databaseName: chatbot_db
    user: chatbot_user
    plan: free
